[profile.default]
bytecode_hash = "none"
evm_version = "cancun"
ffi = false
fs_permissions = [{access = "read-write", path = ".forge-snapshots/"}, {access = "read", path = "test/vectors/"}]
libs = ["lib"]
out = "out"
src = "src"
via_ir = true
optimizer = true
optimizer_runs = 200

[lint]
exclude_lints = ["screaming-snake-case-immutable", "screaming-snake-case-const"]
lint_on_build = false
